services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: finsarthi-backend

    restart: unless-stopped

    ports:
      - "${PORT}:${PORT}"

    env_file:
      - .env

    environment:
      NODE_ENV: development

    volumes:
      - .:/app
      - /app/node_modules

    command: npm start